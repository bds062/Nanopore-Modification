[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanopore-deepmod"
version = "0.1.0"
description = "DeepMod pileup-image models for nanopore modified-base detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "h5py",
  "pod5",
  "pysam",
  "torch",
  "scikit-learn",
  "matplotlib",
  "tqdm",
]

[project.scripts]
deepmod-featurize = "deepmod.featurization:main"
deepmod-train = "deepmod.model:main"
deepmod-visualize = "deepmod.visualization:main"

[tool.setuptools.packages.find]
include = ["deepmod*"]
