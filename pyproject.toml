[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rawmod"
version = "0.1.0"
description = "RawMod: modification-agnostic nanopore base-modification detection from raw signal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "h5py",
  "pod5",
  "pysam",
  "torch",
  "scikit-learn",
  "matplotlib",
  "tqdm",
]

[project.scripts]
rawmod-featurize = "rawmod.featurization:main"
rawmod-train = "rawmod.model:main"
rawmod-visualize = "rawmod.visualization:main"

[tool.setuptools.packages.find]
include = ["rawmod*"]
